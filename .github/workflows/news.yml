name: News to Telegram

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут (время UTC)
  workflow_dispatch:          # кнопка ручного запуска

permissions:
  contents: write             # чтобы сохранять sent.json в репозиторий

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check news and post to Telegram
        run: python bot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Save sent.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add sent.json
          git diff --cached --quiet || (git commit -m "update sent.json" && git push)
